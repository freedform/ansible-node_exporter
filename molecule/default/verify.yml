---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather passwd database
      ansible.builtin.getent:
        database: passwd

    - name: Assert node-exporter user exists
      ansible.builtin.assert:
        that: "'node-exporter' in ansible_facts.getent_passwd"
        fail_msg: "node-exporter system user should exist"

    - name: Stat node_exporter binary
      ansible.builtin.stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_binary

    - name: Assert node_exporter binary exists
      ansible.builtin.assert:
        that: node_exporter_binary.stat.exists
        fail_msg: "/usr/local/bin/node_exporter should exist"

    - name: Assert node_exporter binary has mode 0755
      ansible.builtin.assert:
        that: "node_exporter_binary.stat.mode == '0755'"
        fail_msg: "/usr/local/bin/node_exporter should have mode 0755"

    - name: Stat node_exporter systemd unit file
      ansible.builtin.stat:
        path: /etc/systemd/system/node_exporter.service
      register: node_exporter_service_file

    - name: Assert node_exporter service file exists
      ansible.builtin.assert:
        that: node_exporter_service_file.stat.exists
        fail_msg: "/etc/systemd/system/node_exporter.service should exist"

    - name: Assert node_exporter service file has mode 0644
      ansible.builtin.assert:
        that: "node_exporter_service_file.stat.mode == '0644'"
        fail_msg: "/etc/systemd/system/node_exporter.service should have mode 0644"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert node_exporter service is running
      ansible.builtin.assert:
        that: "ansible_facts.services['node_exporter.service'].state == 'running'"
        fail_msg: "node_exporter.service should be running"

    - name: Fetch node_exporter metrics endpoint on custom telemetry path
      ansible.builtin.uri:
        url: http://localhost:9200/custom-metrics
        status_code: 200
        return_content: true
      register: metrics_response

    - name: Assert metrics endpoint contains node_exporter_build_info
      ansible.builtin.assert:
        that: "'node_exporter_build_info' in metrics_response.content"
        fail_msg: "http://localhost:9200/custom-metrics should contain node_exporter_build_info"

    - name: Assert enabled processes collector metrics are exposed
      ansible.builtin.assert:
        that: "'node_processes_pids' in metrics_response.content"
        fail_msg: "collector.processes flag should have enabled node_processes_pids metric"

    - name: Assert disabled loadavg collector metrics are absent
      ansible.builtin.assert:
        that: "'node_load1 ' not in metrics_response.content"
        fail_msg: "collector.loadavg flag should have disabled node_load1 metric"

    - name: Stat node_exporter textfile collector directory
      ansible.builtin.stat:
        path: /var/lib/node_exporter/textfile_collector
      register: node_exporter_textfile_dir

    - name: Assert textfile collector directory exists with correct ownership
      ansible.builtin.assert:
        that:
          - node_exporter_textfile_dir.stat.exists
          - node_exporter_textfile_dir.stat.isdir
          - node_exporter_textfile_dir.stat.pw_name == 'node-exporter'
          - node_exporter_textfile_dir.stat.mode == '0755'
        fail_msg: "/var/lib/node_exporter/textfile_collector should exist, owned by node-exporter, mode 0755"

    - name: Assert textfile collector metric is exposed
      ansible.builtin.assert:
        that: "'my_batch_job_last_run_seconds 1.7564256e' in metrics_response.content"
        fail_msg: "textfile collector should expose my_batch_job_last_run_seconds from batch.prom"

    - name: Assert textfile collector mtime metric is exposed
      ansible.builtin.assert:
        that: "'node_textfile_mtime_seconds{file=\"/var/lib/node_exporter/textfile_collector/batch.prom\"}' in metrics_response.content"
        fail_msg: "textfile collector should expose node_textfile_mtime_seconds for batch.prom"
