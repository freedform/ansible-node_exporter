# @var node_exporter_actions:description: >
# List of actions the role does, accepts one or more actions.
# Use comma without spaces as a delimiter for multiple actions.
# @var node_exporter_actions:required: `true`
# @var node_exporter_actions:type: String
# @var node_exporter_actions:example: >
#   node_exporter_actions: install
#   node_exporter_actions: install,state_control
# @end

# @var node_exporter_state:description: Target state for the node_exporter daemon
# @var node_exporter_state:type: String
# @var node_exporter_state:required: `true`, only in case `node_exporter_actions: state_control`
# @var node_exporter_state:example: >
#   node_exporter_state: started
#   node_exporter_state: restarted
# @end

# @var node_exporter_version:description: Node exporter version to be installed
# @var node_exporter_version:type: String
# @end
node_exporter_version: 1.10.2

# @var node_exporter_download_base:description: Base URL to download installation artifacts
# @var node_exporter_download_base:type: String
# @end
node_exporter_download_base: https://github.com/prometheus/node_exporter/releases/download

# @var node_exporter_download_dir:description: Destination directory for downloading node exporter binaries
# @var node_exporter_download_dir:type: String
# @end
node_exporter_download_dir: /tmp

# @var node_exporter_bin_dir:description: PATH directory for installed binary
# @var node_exporter_bin_dir:type: String
# @end
node_exporter_bin_dir: /usr/local/bin

# @var node_exporter_user:description: Linux user name to run node exporter service
# @var node_exporter_user:type: String
# @end
node_exporter_user: node-exporter

# @var node_exporter_textfile_directory:description: >
# Directory node_exporter scans for `*.prom` files exposing metrics from cron jobs/scripts
# (the textfile collector). The role creates this directory, owned by `node_exporter_user`,
# and wires `--collector.textfile.directory` to it automatically.
# @var node_exporter_textfile_directory:type: String
# @end
node_exporter_textfile_directory: /var/lib/node_exporter/textfile_collector

# @var node_exporter_extra_flags:description: >
# node_exporter command-line flags, keyed by flag name (without leading dashes). This is the
# single source for all flags passed to node_exporter, including which address it listens on
# (`web.listen-address`, defaults to `:9100` if not set here) and the textfile collector
# directory (`collector.textfile.directory`, defaults to `node_exporter_textfile_directory`).
# Values set here are merged on top of the role's own defaults, so only the keys you want to
# change need to be set. A boolean value renders as `--flag` / `--no-flag` (for
# `--[no-]collector.*` style toggle flags); any other value renders as `--flag=value`.
# @var node_exporter_extra_flags:type: Dict
# @var node_exporter_extra_flags:example: >
#   node_exporter_extra_flags:
#     web.listen-address: ":9200"
#     web.telemetry-path: /metrics
#     collector.processes: true
#     collector.ntp: false
#     collector.textfile.directory: /var/lib/node_exporter/textfile_collector
# @end
node_exporter_extra_flags: {}
